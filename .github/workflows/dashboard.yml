# Builds the dashboard image for the cluster (arm64 for the Raspberry Pi nodes, amd64 for everything else).
name: dashboard
on:
  push:
    branches: [main]
    paths: [apps/dashboard/**, pnpm-lock.yaml, .github/workflows/dashboard.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          file: apps/dashboard/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}-dashboard:${{ github.sha }}
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}-dashboard:latest', github.repository) || '' }}
          cache-from: type=gha,scope=dashboard
          cache-to: type=gha,mode=max,scope=dashboard
