# Copy to secret.yaml (gitignored values), fill in, and `kubectl apply -f`.
apiVersion: v1
kind: Secret
metadata:
  name: swarm-secrets
  namespace: agent-swarm
type: Opaque
stringData:
  # From the Rivet setup: the control plane this runner connects to (with namespace and token).
  RIVET_ENDPOINT: ""
  # Cloudflare API token with AI Gateway Run on the account; the gateway's custom provider holds the model key.
  CLOUDFLARE_AI_GATEWAY_TOKEN: ""
  # A Vercel access token (vercel.com/account/tokens) for the team that holds the board, and that team's ID.
  BOARD_TOKEN: ""
  VERCEL_ORG_ID: ""
  # Optional: self-hosted Executor's MCP endpoint and token.
  EXECUTOR_URL: ""
  EXECUTOR_TOKEN: ""
